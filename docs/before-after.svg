<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
<title id="title">Safely retargeting a Nixpkgs pull request: before and after</title>
<desc id="desc">Excerpt of a fail-fast Bash sequence that validates, rebases, force-pushes, and retargets a Nixpkgs pull request beside its Haiku 5.5-generated summary. The command is visually wrapped and shortened.</desc>
<rect width="1200" height="400" rx="20" fill="#101720"/>
<rect x="20" y="20" width="710" height="316" rx="12" fill="#192330" stroke="#36465a"/>
<rect x="750" y="20" width="430" height="316" rx="12" fill="#192330" stroke="#36465a"/>
<text x="40" y="52" font-family="system-ui, sans-serif" font-size="14" fill="#aebdce" xml:space="preserve">BEFORE · COMMAND EXCERPT</text>
<text x="770" y="52" font-family="system-ui, sans-serif" font-size="14" fill="#83e0b0" xml:space="preserve">AFTER · HAIKU 5.5 SUMMARY</text>
<text x="40" y="84" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="13" fill="#e2e8f0" xml:space="preserve"><tspan fill="#ff7b72">set</tspan><tspan fill="#e2e8f0"> -euo pipefail</tspan></text>
<text x="40" y="113" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="13" fill="#e2e8f0" xml:space="preserve"><tspan fill="#d2a8ff">test</tspan><tspan fill="#e2e8f0"> </tspan><tspan fill="#a5d6ff">&quot;$(git branch --show-current)&quot;</tspan><tspan fill="#e2e8f0"> =</tspan></text>
<text x="40" y="142" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="13" fill="#e2e8f0" xml:space="preserve"><tspan fill="#a5d6ff">  siraben/systemd-repart-disorderfs</tspan></text>
<text x="40" y="171" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="13" fill="#e2e8f0" xml:space="preserve"><tspan fill="#d2a8ff">test</tspan><tspan fill="#e2e8f0"> -z </tspan><tspan fill="#a5d6ff">&quot;$(git status --porcelain </tspan><tspan fill="#8596ab">…</tspan><tspan fill="#a5d6ff">)&quot;</tspan></text>
<text x="40" y="200" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="13" fill="#e2e8f0" xml:space="preserve"><tspan fill="#e2e8f0">old=$(git rev-parse HEAD); parent=$(git rev-parse HEAD^)</tspan></text>
<text x="40" y="229" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="13" fill="#e2e8f0" xml:space="preserve"><tspan fill="#d2a8ff">git</tspan><tspan fill="#e2e8f0"> fetch origin staging; </tspan><tspan fill="#d2a8ff">git</tspan><tspan fill="#e2e8f0"> rebase --onto </tspan><tspan fill="#8596ab">…</tspan></text>
<text x="40" y="258" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="13" fill="#e2e8f0" xml:space="preserve"><tspan fill="#d2a8ff">git</tspan><tspan fill="#e2e8f0"> diff --check; </tspan><tspan fill="#d2a8ff">nixfmt</tspan><tspan fill="#e2e8f0"> --check </tspan><tspan fill="#8596ab">…</tspan></text>
<text x="40" y="287" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="13" fill="#e2e8f0" xml:space="preserve"><tspan fill="#d2a8ff">git</tspan><tspan fill="#e2e8f0"> push --force-with-lease=</tspan><tspan fill="#8596ab">…</tspan></text>
<text x="40" y="316" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="13" fill="#e2e8f0" xml:space="preserve"><tspan fill="#d2a8ff">gh</tspan><tspan fill="#e2e8f0"> pr edit 572619 --base staging; </tspan><tspan fill="#d2a8ff">gh</tspan><tspan fill="#e2e8f0"> pr view 572619 </tspan><tspan fill="#8596ab">…</tspan></text>
<text x="770" y="84" font-family="system-ui, sans-serif" font-size="17" fill="#e2e8f0" xml:space="preserve">Verifying the clean</text>
<text x="770" y="109" font-family="system-ui, sans-serif" font-size="17" fill="#e2e8f0" xml:space="preserve">`siraben/systemd-repart-disorderfs`</text>
<text x="770" y="134" font-family="system-ui, sans-serif" font-size="17" fill="#e2e8f0" xml:space="preserve">branch, rebasing its HEAD commit onto</text>
<text x="770" y="159" font-family="system-ui, sans-serif" font-size="17" fill="#e2e8f0" xml:space="preserve">freshly fetched `origin/staging`,</text>
<text x="770" y="184" font-family="system-ui, sans-serif" font-size="17" fill="#e2e8f0" xml:space="preserve">checking formatting, force-pushing with</text>
<text x="770" y="209" font-family="system-ui, sans-serif" font-size="17" fill="#e2e8f0" xml:space="preserve">a lease, retargeting NixOS/nixpkgs PR</text>
<text x="770" y="234" font-family="system-ui, sans-serif" font-size="17" fill="#e2e8f0" xml:space="preserve">572619 to `staging`, and printing the</text>
<text x="770" y="259" font-family="system-ui, sans-serif" font-size="17" fill="#e2e8f0" xml:space="preserve">PR's base, commits, and files, aborting</text>
<text x="770" y="284" font-family="system-ui, sans-serif" font-size="17" fill="#e2e8f0" xml:space="preserve">on any failure.</text>
<text x="28" y="373" font-family="system-ui, sans-serif" font-size="16" fill="#aebdce" xml:space="preserve">Validate, rebase, and retarget a Nixpkgs pull request · Excerpt shortened for display · Ctrl+O expands the original call</text>
</svg>
