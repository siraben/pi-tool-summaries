<rect x="28" y="598" width="1144" height="194" rx="12" fill="#192330" stroke="#36465a"/>
<text x="48" y="143" font-family="system-ui, sans-serif" font-size="14" fill="#aebdce" xml:space="preserve">BEFORE · FULL BASH COMMAND</text>
<text x="48" y="177" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="16" fill="#e2e8f0" xml:space="preserve"><tspan fill="#d2a8ff">cat</tspan><tspan fill="#e2e8f0"> </tspan><tspan fill="#79c0ff">&gt;</tspan><tspan fill="#e2e8f0"> /tmp/blynn-structural/compare-tinycc.py </tspan><tspan fill="#79c0ff">&lt;&lt;&#x27;PY&#x27;</tspan></text>
<text x="48" y="202" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="16" fill="#e2e8f0" xml:space="preserve"><tspan fill="#a5d6ff">&quot;&quot;&quot;Compare artifacts; normalize only the exact expected installation prefix.&quot;&quot;&quot;</tspan></text>
<text x="48" y="227" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="16" fill="#e2e8f0" xml:space="preserve"><tspan fill="#ff7b72">from</tspan><tspan fill="#e2e8f0"> pathlib </tspan><tspan fill="#ff7b72">import</tspan><tspan fill="#e2e8f0"> Path</tspan></text>
<text x="48" y="252" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="16" fill="#e2e8f0" xml:space="preserve"><tspan fill="#ff7b72">import</tspan><tspan fill="#e2e8f0"> hashlib</tspan><tspan fill="#79c0ff">,</tspan><tspan fill="#e2e8f0">json</tspan></text>
<text x="48" y="277" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="16" fill="#e2e8f0" xml:space="preserve"><tspan fill="#e2e8f0">old</tspan><tspan fill="#79c0ff">=</tspan><tspan fill="#e2e8f0">Path</tspan><tspan fill="#79c0ff">(</tspan><tspan fill="#a5d6ff">&#x27;/nix/store/616qf0b4c1jpfd45i9g9zss94gcgya48-tinycc-boot-hcc-m2-precisely-m2-unstable-2025-12-03&#x27;</tspan><tspan fill="#79c0ff">)</tspan></text>
<text x="48" y="302" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="16" fill="#e2e8f0" xml:space="preserve"><tspan fill="#e2e8f0">new</tspan><tspan fill="#79c0ff">=</tspan><tspan fill="#e2e8f0">Path</tspan><tspan fill="#79c0ff">(</tspan><tspan fill="#a5d6ff">&#x27;/nix/store/4mjpbm5w9246lig1lhm8p2wxmn3j0vzq-tinycc-boot-hcc-m2-precisely-m2-unstable-2025-12-03&#x27;</tspan><tspan fill="#79c0ff">)</tspan></text>
<text x="48" y="327" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="16" fill="#e2e8f0" xml:space="preserve"><tspan fill="#e2e8f0">rows</tspan><tspan fill="#79c0ff">=[]</tspan></text>
<text x="48" y="352" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="16" fill="#e2e8f0" xml:space="preserve"><tspan fill="#ff7b72">for</tspan><tspan fill="#e2e8f0"> name </tspan><tspan fill="#ff7b72">in</tspan><tspan fill="#e2e8f0"> </tspan><tspan fill="#79c0ff">[</tspan><tspan fill="#a5d6ff">&#x27;bin/tcc-hcc-stage1&#x27;</tspan><tspan fill="#79c0ff">,</tspan><tspan fill="#a5d6ff">&#x27;bin/tcc-stage2&#x27;</tspan><tspan fill="#79c0ff">,</tspan><tspan fill="#a5d6ff">&#x27;bin/tcc&#x27;</tspan><tspan fill="#79c0ff">]:</tspan></text>
<text x="48" y="377" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="16" fill="#e2e8f0" xml:space="preserve"><tspan fill="#e2e8f0"> a</tspan><tspan fill="#79c0ff">,</tspan><tspan fill="#e2e8f0">b</tspan><tspan fill="#79c0ff">=(</tspan><tspan fill="#e2e8f0">x</tspan><tspan fill="#79c0ff">.</tspan><tspan fill="#e2e8f0">joinpath</tspan><tspan fill="#79c0ff">(</tspan><tspan fill="#e2e8f0">name</tspan><tspan fill="#79c0ff">).</tspan><tspan fill="#e2e8f0">read_bytes</tspan><tspan fill="#79c0ff">()</tspan><tspan fill="#e2e8f0"> </tspan><tspan fill="#ff7b72">for</tspan><tspan fill="#e2e8f0"> x </tspan><tspan fill="#ff7b72">in</tspan><tspan fill="#e2e8f0"> </tspan><tspan fill="#79c0ff">(</tspan><tspan fill="#e2e8f0">old</tspan><tspan fill="#79c0ff">,</tspan><tspan fill="#e2e8f0">new</tspan><tspan fill="#79c0ff">))</tspan></text>
<text x="48" y="402" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="16" fill="#e2e8f0" xml:space="preserve"><tspan fill="#e2e8f0"> </tspan><tspan fill="#ff7b72">assert</tspan><tspan fill="#e2e8f0"> a</tspan><tspan fill="#79c0ff">.</tspan><tspan fill="#e2e8f0">count</tspan><tspan fill="#79c0ff">(</tspan><tspan fill="#d2a8ff">str</tspan><tspan fill="#79c0ff">(</tspan><tspan fill="#e2e8f0">old</tspan><tspan fill="#79c0ff">).</tspan><tspan fill="#e2e8f0">encode</tspan><tspan fill="#79c0ff">())==</tspan><tspan fill="#e2e8f0">b</tspan><tspan fill="#79c0ff">.</tspan><tspan fill="#e2e8f0">count</tspan><tspan fill="#79c0ff">(</tspan><tspan fill="#d2a8ff">str</tspan><tspan fill="#79c0ff">(</tspan><tspan fill="#e2e8f0">new</tspan><tspan fill="#79c0ff">).</tspan><tspan fill="#e2e8f0">encode</tspan><tspan fill="#79c0ff">())==</tspan><tspan fill="#d2a8ff">1</tspan></text>
<text x="48" y="427" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="16" fill="#e2e8f0" xml:space="preserve"><tspan fill="#e2e8f0"> </tspan><tspan fill="#ff7b72">assert</tspan><tspan fill="#e2e8f0"> a</tspan><tspan fill="#79c0ff">.</tspan><tspan fill="#e2e8f0">replace</tspan><tspan fill="#79c0ff">(</tspan><tspan fill="#d2a8ff">str</tspan><tspan fill="#79c0ff">(</tspan><tspan fill="#e2e8f0">old</tspan><tspan fill="#79c0ff">).</tspan><tspan fill="#e2e8f0">encode</tspan><tspan fill="#79c0ff">(),</tspan><tspan fill="#d2a8ff">str</tspan><tspan fill="#79c0ff">(</tspan><tspan fill="#e2e8f0">new</tspan><tspan fill="#79c0ff">).</tspan><tspan fill="#e2e8f0">encode</tspan><tspan fill="#79c0ff">())==</tspan><tspan fill="#e2e8f0">b</tspan></text>
<text x="48" y="452" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="16" fill="#e2e8f0" xml:space="preserve"><tspan fill="#e2e8f0"> rows</tspan><tspan fill="#79c0ff">.</tspan><tspan fill="#e2e8f0">append</tspan><tspan fill="#79c0ff">(</tspan><tspan fill="#d2a8ff">dict</tspan><tspan fill="#79c0ff">(</tspan><tspan fill="#e2e8f0">file</tspan><tspan fill="#79c0ff">=</tspan><tspan fill="#e2e8f0">name</tspan><tspan fill="#79c0ff">,</tspan><tspan fill="#d2a8ff">bytes</tspan><tspan fill="#79c0ff">=</tspan><tspan fill="#d2a8ff">len</tspan><tspan fill="#79c0ff">(</tspan><tspan fill="#e2e8f0">a</tspan><tspan fill="#79c0ff">),</tspan><tspan fill="#e2e8f0">baseline_sha256</tspan><tspan fill="#79c0ff">=</tspan><tspan fill="#e2e8f0">hashlib</tspan><tspan fill="#79c0ff">.</tspan><tspan fill="#e2e8f0">sha256</tspan><tspan fill="#79c0ff">(</tspan><tspan fill="#e2e8f0">a</tspan><tspan fill="#79c0ff">).</tspan><tspan fill="#e2e8f0">hexdigest</tspan><tspan fill="#79c0ff">(),</tspan><tspan fill="#e2e8f0">candidate_sha256</tspan><tspan fill="#79c0ff">=</tspan><tspan fill="#e2e8f0">hashlib</tspan><tspan fill="#79c0ff">.</tspan></text>
<text x="48" y="477" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="16" fill="#e2e8f0" xml:space="preserve"><tspan fill="#e2e8f0">sha256</tspan><tspan fill="#79c0ff">(</tspan><tspan fill="#e2e8f0">b</tspan><tspan fill="#79c0ff">).</tspan><tspan fill="#e2e8f0">hexdigest</tspan><tspan fill="#79c0ff">(),</tspan><tspan fill="#e2e8f0">equal_after_own_store_prefix_normalization</tspan><tspan fill="#79c0ff">=</tspan><tspan fill="#ff7b72">True</tspan><tspan fill="#79c0ff">))</tspan></text>
<text x="48" y="502" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="16" fill="#e2e8f0" xml:space="preserve"><tspan fill="#d2a8ff">print</tspan><tspan fill="#79c0ff">(</tspan><tspan fill="#e2e8f0">json</tspan><tspan fill="#79c0ff">.</tspan><tspan fill="#e2e8f0">dumps</tspan><tspan fill="#79c0ff">(</tspan><tspan fill="#d2a8ff">dict</tspan><tspan fill="#79c0ff">(</tspan><tspan fill="#e2e8f0">baseline</tspan><tspan fill="#79c0ff">=</tspan><tspan fill="#d2a8ff">str</tspan><tspan fill="#79c0ff">(</tspan><tspan fill="#e2e8f0">old</tspan><tspan fill="#79c0ff">),</tspan><tspan fill="#e2e8f0">candidate</tspan><tspan fill="#79c0ff">=</tspan><tspan fill="#d2a8ff">str</tspan><tspan fill="#79c0ff">(</tspan><tspan fill="#e2e8f0">new</tspan><tspan fill="#79c0ff">),</tspan><tspan fill="#e2e8f0">artifacts</tspan><tspan fill="#79c0ff">=</tspan><tspan fill="#e2e8f0">rows</tspan><tspan fill="#79c0ff">),</tspan><tspan fill="#e2e8f0">indent</tspan><tspan fill="#79c0ff">=</tspan><tspan fill="#d2a8ff">2</tspan><tspan fill="#79c0ff">))</tspan></text>
<text x="48" y="527" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="16" fill="#e2e8f0" xml:space="preserve"><tspan fill="#a5d6ff">PY</tspan></text>
<text x="48" y="552" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="16" fill="#e2e8f0" xml:space="preserve"><tspan fill="#d2a8ff">python3</tspan><tspan fill="#e2e8f0"> /tmp/blynn-structural/compare-tinycc.py </tspan><tspan fill="#79c0ff">&gt;</tspan><tspan fill="#e2e8f0"> /tmp/blynn-structural/tinycc-artifacts.json</tspan></text>
<text x="48" y="631" font-family="system-ui, sans-serif" font-size="14" fill="#83e0b0" xml:space="preserve">AFTER · COLLAPSED SUMMARY</text>
<text x="48" y="668" font-family="system-ui, sans-serif" font-size="22" fill="#e2e8f0">Writing a Python comparison script, then running it to verify three binaries match after</text>
<text x="48" y="698" font-family="system-ui, sans-serif" font-size="22" fill="#e2e8f0">replacing their respective store paths, calculate hashes, and overwrite a JSON report;</text>
<text x="48" y="728" font-family="system-ui, sans-serif" font-size="22" fill="#e2e8f0">assertions can fail if paths or normalized contents differ.</text>
