<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
<title id="title">Tracing a Pi API change: before and after</title>
<desc id="desc">Excerpt of a command that clones Pi and searches its API history beside its Haiku 5.5-generated summary. The command is visually wrapped and shortened.</desc>
<rect width="1200" height="400" rx="20" fill="#101720"/>
<rect x="20" y="20" width="710" height="316" rx="12" fill="#192330" stroke="#36465a"/>
<rect x="750" y="20" width="430" height="316" rx="12" fill="#192330" stroke="#36465a"/>
<text x="40" y="52" font-family="system-ui, sans-serif" font-size="14" fill="#aebdce" xml:space="preserve">BEFORE · COMMAND EXCERPT</text>
<text x="770" y="52" font-family="system-ui, sans-serif" font-size="14" fill="#83e0b0" xml:space="preserve">AFTER · HAIKU 5.5 SUMMARY</text>
<text x="40" y="86" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="14" fill="#e2e8f0" xml:space="preserve"><tspan fill="#d2a8ff">rm</tspan><tspan fill="#e2e8f0"> -rf /tmp/pi-api-history </tspan><tspan fill="#79c0ff">&amp;&amp;</tspan></text>
<text x="40" y="115" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="14" fill="#e2e8f0" xml:space="preserve"><tspan fill="#d2a8ff">git</tspan><tspan fill="#e2e8f0"> clone --filter=blob:none --no-checkout</tspan></text>
<text x="40" y="144" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="14" fill="#e2e8f0" xml:space="preserve"><tspan fill="#a5d6ff">  https://github.com/earendil-works/pi.git</tspan><tspan fill="#e2e8f0"> /tmp/pi-api-history</tspan></text>
<text x="40" y="173" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="14" fill="#e2e8f0" xml:space="preserve"><tspan fill="#79c0ff">  &gt;</tspan><tspan fill="#e2e8f0">/dev/null </tspan><tspan fill="#79c0ff">2&gt;&amp;1 &amp;&amp;</tspan></text>
<text x="40" y="202" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="14" fill="#e2e8f0" xml:space="preserve"><tspan fill="#d2a8ff">cd</tspan><tspan fill="#e2e8f0"> /tmp/pi-api-history </tspan><tspan fill="#79c0ff">&amp;&amp;</tspan></text>
<text x="40" y="231" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="14" fill="#e2e8f0" xml:space="preserve"><tspan fill="#d2a8ff">git</tspan><tspan fill="#e2e8f0"> log --all --date=iso-strict</tspan></text>
<text x="40" y="260" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="14" fill="#e2e8f0" xml:space="preserve"><tspan fill="#e2e8f0">  --format=</tspan><tspan fill="#a5d6ff">&#x27;%H%x09%ad%x09%s&#x27;</tspan><tspan fill="#e2e8f0"> -S</tspan><tspan fill="#a5d6ff">&#x27;QueuedInputDisposition&#x27;</tspan></text>
<text x="40" y="289" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="14" fill="#e2e8f0" xml:space="preserve"><tspan fill="#e2e8f0">  -- packages/coding-agent/src/</tspan><tspan fill="#8596ab">…</tspan><tspan fill="#e2e8f0"> </tspan><tspan fill="#79c0ff">|</tspan><tspan fill="#e2e8f0"> </tspan><tspan fill="#d2a8ff">head</tspan><tspan fill="#e2e8f0"> -30</tspan></text>
<text x="770" y="86" font-family="system-ui, sans-serif" font-size="17" fill="#e2e8f0" xml:space="preserve">Removing any existing</text>
<text x="770" y="111" font-family="system-ui, sans-serif" font-size="17" fill="#e2e8f0" xml:space="preserve">/tmp/pi-api-history, cloning the</text>
<text x="770" y="136" font-family="system-ui, sans-serif" font-size="17" fill="#e2e8f0" xml:space="preserve">earendil-works/pi repo there without</text>
<text x="770" y="161" font-family="system-ui, sans-serif" font-size="17" fill="#e2e8f0" xml:space="preserve">checkout, and listing up to 30 commits</text>
<text x="770" y="186" font-family="system-ui, sans-serif" font-size="17" fill="#e2e8f0" xml:space="preserve">(hash, date, subject) that changed</text>
<text x="770" y="211" font-family="system-ui, sans-serif" font-size="17" fill="#e2e8f0" xml:space="preserve">`QueuedInputDisposition` in two source</text>
<text x="770" y="236" font-family="system-ui, sans-serif" font-size="17" fill="#e2e8f0" xml:space="preserve">files, with clone output suppressed and</text>
<text x="770" y="261" font-family="system-ui, sans-serif" font-size="17" fill="#e2e8f0" xml:space="preserve">the listing skipped if the clone fails.</text>
<text x="28" y="373" font-family="system-ui, sans-serif" font-size="16" fill="#aebdce" xml:space="preserve">Clone Pi and trace an API change · Excerpt shortened for display · Ctrl+O expands the original call</text>
</svg>
