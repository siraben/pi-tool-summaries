<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
<title id="title">Bootstrapping RISC-V tools under QEMU: before and after</title>
<desc id="desc">Excerpt of a fail-fast Bash workflow that bootstraps RISC-V stage0 tools under QEMU beside its Haiku 5.5-generated summary. The command is visually wrapped and shortened.</desc>
<rect width="1200" height="400" rx="20" fill="#101720"/>
<rect x="20" y="20" width="710" height="316" rx="12" fill="#192330" stroke="#36465a"/>
<rect x="750" y="20" width="430" height="316" rx="12" fill="#192330" stroke="#36465a"/>
<text x="40" y="52" font-family="system-ui, sans-serif" font-size="14" fill="#aebdce" xml:space="preserve">BEFORE · COMMAND EXCERPT</text>
<text x="770" y="52" font-family="system-ui, sans-serif" font-size="14" fill="#83e0b0" xml:space="preserve">AFTER · HAIKU 5.5 SUMMARY</text>
<text x="40" y="80" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" fill="#e2e8f0" xml:space="preserve"><tspan fill="#ff7b72">set</tspan><tspan fill="#e2e8f0"> -euo pipefail</tspan></text>
<text x="40" y="103" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" fill="#e2e8f0" xml:space="preserve"><tspan fill="#e2e8f0">src=/nix/store/</tspan><tspan fill="#8596ab">…</tspan><tspan fill="#e2e8f0">-stage0-posix-1.9.1-source</tspan></text>
<text x="40" y="126" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" fill="#e2e8f0" xml:space="preserve"><tspan fill="#e2e8f0">seed=/nix/store/</tspan><tspan fill="#8596ab">…</tspan><tspan fill="#e2e8f0">-hex0-seed</tspan></text>
<text x="40" y="149" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" fill="#e2e8f0" xml:space="preserve"><tspan fill="#e2e8f0">qemu=/run/current-system/sw/bin/qemu-riscv64; tmp=$(mktemp -d </tspan><tspan fill="#8596ab">…</tspan><tspan fill="#e2e8f0">)</tspan></text>
<text x="40" y="172" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" fill="#e2e8f0" xml:space="preserve"><tspan fill="#ff7b72">trap</tspan><tspan fill="#e2e8f0"> </tspan><tspan fill="#a5d6ff">&#x27;rm -rf &quot;$tmp&quot;&#x27;</tspan><tspan fill="#e2e8f0"> EXIT</tspan></text>
<text x="40" y="195" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" fill="#e2e8f0" xml:space="preserve"><tspan fill="#d2a8ff">cp</tspan><tspan fill="#e2e8f0"> -a &quot;$src&quot; &quot;$tmp/src&quot;; </tspan><tspan fill="#d2a8ff">chmod</tspan><tspan fill="#e2e8f0"> -R u+w &quot;$tmp/src&quot;</tspan></text>
<text x="40" y="218" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" fill="#e2e8f0" xml:space="preserve"><tspan fill="#d2a8ff">mkdir</tspan><tspan fill="#e2e8f0"> -p &quot;$tmp/src/riscv64/artifact&quot; &quot;$tmp/src/riscv64/bin&quot;</tspan></text>
<text x="40" y="241" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" fill="#e2e8f0" xml:space="preserve"><tspan fill="#e2e8f0">&quot;$qemu&quot; &quot;$tmp/seed&quot; &quot;$tmp/src/riscv64/hex0_riscv64.hex0&quot; </tspan><tspan fill="#8596ab">…</tspan></text>
<text x="40" y="264" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" fill="#e2e8f0" xml:space="preserve"><tspan fill="#d2a8ff">perl</tspan><tspan fill="#e2e8f0"> -pe </tspan><tspan fill="#a5d6ff">&#x27;s{</tspan><tspan fill="#8596ab">…</tspan><tspan fill="#a5d6ff">}{</tspan><tspan fill="#8596ab">…</tspan><tspan fill="#a5d6ff">}&#x27;</tspan><tspan fill="#e2e8f0"> </tspan><tspan fill="#8596ab">…</tspan><tspan fill="#79c0ff"> &gt;</tspan><tspan fill="#e2e8f0"> &quot;$tmp/run.sh&quot;</tspan></text>
<text x="40" y="287" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" fill="#e2e8f0" xml:space="preserve"><tspan fill="#79c0ff">(</tspan><tspan fill="#d2a8ff">cd</tspan><tspan fill="#e2e8f0"> &quot;$tmp/src&quot;; </tspan><tspan fill="#d2a8ff">bash</tspan><tspan fill="#e2e8f0"> &quot;$tmp/run.sh&quot;</tspan><tspan fill="#79c0ff">) &gt;</tspan><tspan fill="#e2e8f0">&quot;$tmp/build.log&quot; </tspan><tspan fill="#79c0ff">2&gt;&amp;1</tspan></text>
<text x="40" y="310" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" fill="#e2e8f0" xml:space="preserve"><tspan fill="#d2a8ff">file</tspan><tspan fill="#e2e8f0"> &quot;$tmp/src/riscv64/bin/M1&quot; </tspan><tspan fill="#8596ab">…</tspan><tspan fill="#e2e8f0">; </tspan><tspan fill="#d2a8ff">sha256sum</tspan><tspan fill="#e2e8f0"> &quot;$tmp/src/riscv64/bin/M1&quot; </tspan><tspan fill="#8596ab">…</tspan></text>
<text x="770" y="80" font-family="system-ui, sans-serif" font-size="16" fill="#e2e8f0" xml:space="preserve">Copying the stage0 source to a</text>
<text x="770" y="104" font-family="system-ui, sans-serif" font-size="16" fill="#e2e8f0" xml:space="preserve">temporary directory, running the hex0</text>
<text x="770" y="128" font-family="system-ui, sans-serif" font-size="16" fill="#e2e8f0" xml:space="preserve">seed under QEMU to build the hex0</text>
<text x="770" y="152" font-family="system-ui, sans-serif" font-size="16" fill="#e2e8f0" xml:space="preserve">artifact, executing the QEMU-wrapped</text>
<text x="770" y="176" font-family="system-ui, sans-serif" font-size="16" fill="#e2e8f0" xml:space="preserve">mescc-tools-mini-kaem build script with</text>
<text x="770" y="200" font-family="system-ui, sans-serif" font-size="16" fill="#e2e8f0" xml:space="preserve">output logged to a file, then printing</text>
<text x="770" y="224" font-family="system-ui, sans-serif" font-size="16" fill="#e2e8f0" xml:space="preserve">file types and SHA-256 hashes of the</text>
<text x="770" y="248" font-family="system-ui, sans-serif" font-size="16" fill="#e2e8f0" xml:space="preserve">resulting M1, hex2, and kaem binaries,</text>
<text x="770" y="272" font-family="system-ui, sans-serif" font-size="16" fill="#e2e8f0" xml:space="preserve">while aborting on any error and deleting</text>
<text x="770" y="296" font-family="system-ui, sans-serif" font-size="16" fill="#e2e8f0" xml:space="preserve">the temporary directory on exit.</text>
<text x="28" y="373" font-family="system-ui, sans-serif" font-size="16" fill="#aebdce" xml:space="preserve">Bootstrap a RISC-V stage0 toolchain under QEMU · Excerpt shortened for display · Ctrl+O expands the original call</text>
</svg>
