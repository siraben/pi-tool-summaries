name: Check
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      # npm 12 honors the patched dependency override instead of Pi's shrinkwrap.
      - run: npx --yes npm@12.2.0 ci --ignore-scripts
      - run: npm audit
        if: matrix.os == 'ubuntu-latest' && matrix.node == 22
      # Runs full native Bash tests on Unix; portable + native PowerShell on Windows.
      # This invokes verification only, never npm publish.
      - run: npm run prepublishOnly
  compatibility:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pi: [0.84.4, 0.99.2, 1.3.0]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npx --yes npm@12.2.0 ci --ignore-scripts
      - run: npx --yes npm@12.2.0 install --ignore-scripts --no-save --package-lock=false @earendil-works/pi-coding-agent@${{ matrix.pi }} @earendil-works/pi-tui@${{ matrix.pi }}
      - run: npm run check
      - run: npm test
      - run: npm run test:package
